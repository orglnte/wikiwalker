[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wikiwalker"
version = "0.1.0"
description = "Shortest path between two Wikipedia articles"
requires-python = ">=3.14"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["link_store", "wikifetcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
